<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Экзаменационные карточки</title>
<style>
:root{--bg1:#f6f3ee;--bg2:#efefe8;--card:#fffdf9;--ink:#2f2a27;--mute:#7b7570;--btn:#2f2a27;--btnink:#fff;--soft:#fbf9f5;--line:#ebe6df;--pink:#e8d5d3;--green:#dde7dc;--track:#f8f6f2;--sh:0 24px 60px rgba(60,50,40,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1b19;--bg2:#181716;--card:#2a2724;--ink:#f1ece4;--mute:#a59d92;--btn:#f1ece4;--btnink:#1d1b19;--soft:#33302c;--line:#3d3833;--pink:#5a4443;--green:#3f4e41;--track:#33302c;--sh:0 24px 60px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg1:#1d1b19;--bg2:#181716;--card:#2a2724;--ink:#f1ece4;--mute:#a59d92;--btn:#f1ece4;--btnink:#1d1b19;--soft:#33302c;--line:#3d3833;--pink:#5a4443;--green:#3f4e41;--track:#33302c;--sh:0 24px 60px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.35;min-height:100vh}
main{max-width:860px;margin:0 auto;padding:28px 14px 40px}
.deck{margin-bottom:72px;scroll-margin-top:12px}
h2{font-weight:400;font-size:clamp(34px,8vw,56px);text-align:center;margin:8px 0 6px}
.sub{font-family:system-ui,-apple-system,sans-serif;text-align:center;color:var(--mute);font-size:clamp(14px,3.5vw,17px);margin:0 0 22px}
.prog{display:flex;align-items:center;gap:14px;font-family:system-ui,-apple-system,sans-serif;margin-bottom:14px}
.prog b{font-size:clamp(14px,3.6vw,17px);white-space:nowrap}
.bar{flex:1;height:10px;border-radius:10px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#d4b9b3,#b7cbbb);transition:width .35s}
.card{position:relative;background:var(--card);border-radius:clamp(26px,5vw,44px);box-shadow:var(--sh);padding:clamp(20px,4vw,34px);min-height:clamp(300px,52vh,460px);display:flex;flex-direction:column;cursor:pointer;user-select:none}
.tag{font-family:system-ui,-apple-system,sans-serif;font-weight:700;font-size:clamp(12px,3vw,15px);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 0;overflow-wrap:anywhere}
.txt{font-size:clamp(22px,5.6vw,38px);line-height:1.28;animation:pop .28s ease}
.txt.miss{color:var(--mute);font-size:clamp(18px,4.4vw,26px);font-style:italic}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{font-family:system-ui,-apple-system,sans-serif;text-align:center;color:var(--mute);font-size:clamp(12px,3.2vw,16px)}
.row{display:flex;gap:10px;margin-top:14px;font-family:system-ui,-apple-system,sans-serif}
button{font:inherit;border:0;cursor:pointer;color:var(--ink);min-height:52px;border-radius:20px;background:var(--soft);box-shadow:0 6px 18px rgba(60,50,40,.08);font-weight:700;font-size:clamp(15px,4vw,19px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
.nav{width:clamp(52px,12vw,76px);flex:none;font-size:22px}
.show{flex:1;background:var(--btn);color:var(--btnink)}
.rate{flex:1}.rep{background:var(--pink)}.kn{background:var(--green)}
.small{justify-content:center;flex-wrap:wrap}
.small button{min-height:46px;padding:0 20px;border-radius:999px;font-weight:500;border:1px solid var(--line);box-shadow:none;font-size:clamp(14px,3.8vw,17px)}
.done{background:var(--card);border-radius:clamp(26px,5vw,44px);box-shadow:var(--sh);padding:clamp(32px,7vw,56px) 20px;text-align:center;font-family:system-ui,-apple-system,sans-serif}
.done h3{font-family:Georgia,serif;font-weight:400;font-size:clamp(30px,7vw,48px);margin:0 0 14px}
.done p{color:var(--mute);margin:0 0 22px;font-size:clamp(16px,4vw,19px)}
.done .row{justify-content:center;flex-wrap:wrap}
.done button{padding:0 28px}
.done .main{background:var(--btn);color:var(--btnink)}
[hidden]{display:none!important}
footer{text-align:center;color:var(--mute);font-family:system-ui,sans-serif;font-size:13px;padding-bottom:24px}
@media (max-width:480px){main{padding:18px 10px 24px}.row{gap:8px}}
</style>
</head>
<body>
<main id="app"></main>
<footer>© 2026</footer>
<script type="text/plain" id="d1">Какое условие работы с шоковой травмой включает в себя границы, центрирование и заземление?|Телесная безопасность.
Что подразумевает эмоциональная безопасность в контексте работы с шоковой травмой?|Принятие в группе, поддержка процессов и создание «поля любви».
Какое условие работы с шоковой травмой характеризуется информационной доступностью и когнитивными навыками?|Ментальная безопасность.
В бодинамике ответственность — это способность управлять своими _____ и _____.|вниманием; состояниями
Назовите первый этап работы с шоковой травмой.|Создание необходимых условий (безопасности, ответственности, интеграции и вектора будущего).
На каком этапе работы с шоковой травмой происходит телесная разрядка?|Третий этап.
Согласно бодинамическому подходу, безопасность — это не отсутствие угроз, а наличие достаточного _____.|ресурса, чтобы с ними справиться
Как называется внутреннее телесное переживание, формирующееся через постоянный обмен сигналами между мозгом и телом?|Состояние безопасности.
Какая система управляет состоянием безопасности и лежит в основе доверия?|Автономная нервная система.
Термин: Интероцепция|Способность ощущать внутреннее состояние организма (голод, жажду, боль, эмоции).
Термин: Проприоцепция|Способность осознавать положение частей своего тела в пространстве и их движения.
Как называется процесс, при котором нервная система автоматически и бессознательно оценивает риск в окружающей среде?|Нейроцепция.
Кто ввел термин «нейроцепция»?|Стивен Порджес.
В какой части мозга осуществляется процесс нейроцепции?|В примитивных отделах мозга.
Как травмированные люди часто ошибочно трактуют объективную опасность из-за нарушения системы обратной связи?|Как безопасность.
Что происходит с человеком в травме на уровне проприоцепции?|Он знает, что у него есть тело, но не чувствует его.
Какая часть мозга отвечает за автоматические регуляторные функции, такие как дрожь при холоде?|Рептильный мозг.
Какая система мозга отвечает за возникновение эмоций?|Лимбическая система.
За какие процессы отвечает неокортекс?|Узнавание, память, абстрактное мышление и философия.
Какая ветвь периферической НС обеспечивает осознанный контроль мышц?|Соматическая нервная система.
Назовите три основные функции нервных окончаний.|Сенсорная (восприятие), интеграционная (обработка) и моторная (движение).
Как называется система, активирующая режим «борьбы или бегства»?|Эрготропная система (симметрична симпатической НС).
Какая система включается, когда организму нужно восстанавливаться и накапливать энергию?|Трофотропная система (парасимпатическая НС).
Какой нерв связывает мозг с большинством внутренних органов и регулирует сердцебиение и пищеварение?|Блуждающий нерв (Nervus Vagus).
Какое состояние по Поливагальной теории соответствует режиму социального взаимодействия и безопасности?|Вентральное вагальное состояние.
Какое состояние характеризуется замиранием, отключением и экономией энергии при крайнем стрессе?|Дорсальное вагальное состояние.
Что происходит с частотой сердечных сокращений в симпатическом состоянии?|Она повышается.
В каком состоянии активируются эндорфины для повышения болевого порога при «подготовке к смерти»?|Дорсальное вагальное состояние.
Как называется гормон, участвующий в формировании социальных связей в вентральном вагальном состоянии?|Окситоцин.
Безопасность в бодинамике — это _____ между способностью сдаться и атаковать.|баланс
Какая мышца отвечает за заземление и тестирование реальности?|Подколенная мышца (Popliteus).
Психологическая функция какой мышцы — «придерживаться собственного мнения»?|Подколенная мышца (Popliteus).
Что происходит с подколенной мышцей в шоковой ситуации при гипертонусе?|Она внезапно напрягается, и человек коллапсирует.
Где расположен подвздошный гребень (Iliak crest)?|Вдоль линии талии.
Какая психологическая функция связана с латеральной частью подвздошного гребня в пубертате?|Прокладывание собственного пути и сохранение достоинства.
Психологическая функция тонкой мышцы (Gracilis) в период автономии — это _____.|импульс выползать в мир и исследовать его
Какая мышца помогает сохранять гибкость в мнениях в ситуациях сильного стресса?|Портняжная мышца (Sartorius).
К какому рефлексу относится подошвенная мышца (Plantaris)?|Рефлекс бега/прыжка, активирующийся в шоке.
Какая мышца связана со способностью воспринимать мир и облекать опыт в слова?|Ременная мышца головы (Splenius capitis).
Что происходит с мышцами тазовой диафрагмы при шоковом «замирании»?|Они расслабляются или спадают (коллапсируют).
Как называется упражнение для якорения состояния безопасности через работу с двумя пространствами?|Маркеры безопасности.
Какова цель упражнения с листами «Иммобилизация», «Мобилизация» и «Безопасность»?|Обнаружить, что безопасность — это точка, где можно выбрать реакцию.
Как называется эго-функция, отвечающая за тестирование реальности и связь с землей?|Заземление.
Какая эго-функция включает в себя подфункцию «контейнирование эмоций»?|Управление энергией.
Назовите 5 подфункций эго-функции «Границы».|Физические, личного пространства, территориальные, социального пространства, создание пространства в контакте.
Какая эго-функция работает с запросом «не знаю, что хочу» и «потеря себя»?|Центрирование.
Что такое самоценность в бодинамике?|Ощущение собственной ценности как факта жизни в теле.
В чем отличие самооценки от самоценности?|Самооценка — это критическое оценивание поступков на основе системы ценностей.
Какая эго-функция отвечает за способность говорить «стоп» и отталкивать?|Границы (подфункция отталкивания).
Какая мышца (головка) отвечает за создание пространства для совершения выборов?|Задняя головка дельтовидной мышцы.
Функция какой мышцы — «притягивать к себе и крепко держать у сердца»?|Лучевой сгибатель запястья (Flexor carpi radialis).
Какая мышца отвечает за интеграцию норм и ценностей?|Выпрямляющая мышца спины (Erector spinae).
Как называется мышца гордецов, отвечающая за исследовательское любопытство?|Procerus.
Какая структура характера имеет драйв «Я есть»?|Структура Существования.
В чем различие ранней и поздней структур Существования?|Ранняя — ментальное существование, поздняя — эмоциональное.
Какой драйв соответствует структуре Потребности?|Поиск удовлетворения потребностей.
Какая структура характера ориентирована на деятельность и осознание собственных импульсов?|Структура Автономии.
Для какой структуры ключевым является баланс между любовью и силой?|Структура Любви/Сексуальности.
Какая структура фокусируется на формировании собственных правил и мнений?|Структура Мнения.
Назовите уровни формирования шоковой травмы.|Личностный, Духовный, Телесный.
Перечислите признаки «бегущего» в шоковой травме.|Бледная кожа, белеющий кончик носа, бегающие зрачки, слабость, головокружение.
Какая мышца отвечает за границы личного пространства (дистанцию)?|Промежуточная широкая мышца бедра (Vastus intermedius).
Функция какой мышцы — «границы социального пространства»?|Прямая мышца бедра (Rectus femoris).
Какая мышца связана с территориальными границами (созданием «своего угла»)?|Латеральная широкая мышца бедра (Vastus lateralis).
За какую функцию отвечает медиальная широкая мышца бедра (Vastus medialis)?|Границы личного пространства и осознанный выбор в интимных зонах.
Какая мышца обеспечивает «чувство прикрытой спины» для получения поддержки?|Широчайшая мышца спины (Latissimus dorsi).
Какая эго-функция описывает, как мы «сплетаемся» друг с другом?|Связанность (Бондинг).
Какая мышца связана с невольным включением дыхательного рефлекса и опытом жизненной силы?|Поперечная мышца груди (Transversus thoracis).
Функция какой мышцы — «сохранение достоинства и выражение чувственности при флирте»?|Ременная мышца шеи (Splenius cervicis).
К какой эго-функции относится подфункция «тестирование реальности»?|Заземление.
Какая мышца отвечает за баланс между управлением стрессом и разрешением ситуации?|Тонкая мышца (Gracilis).
Назовите 3 аспекта Эго в бодинамике.|Телесное, Индивидуальное, Ролевое (а также Наблюдающее, Интегрирующее, Высшее Я).
Что происходит с мышцей в состоянии гипертонуса в бодинамике?|Она получает избыточный поток импульсов и не может «выключиться», тратя энергию на удержание.
Какая мышца отвечает за способность «хватать жизнь» и продвигаться вперед?|Мышцы структуры Солидарности.
Для чего используется техника «Нитка/Стоп»?|Для проработки границ и телесной/эмоциональной безопасности.
Как в бодинамике называется процесс усвоения нового опыта системой?|Интеграция.
Какая мышца связана со способностью «быть реалистом в стрессовых ситуациях»?|Подколенная мышца (Popliteus).
В какой период развития формируется способность сидеть в «позе лотоса» (мышца Sartorius)?|Период Воли/Мнения.
Какая мышца помогает сохранять этичность при высоком уровне энергии?|Подколенная мышца (Popliteus).
Какая эго-функция отвечает за умение просить о помощи, не теряя достоинства?|Паттерны межличностного общения (Способность к контакту).
Что такое «когнитивное схватывание» в контексте эго-функций?|Способность понимать и перерабатывать информацию (подфункция когнитивных навыков).
Какая мышца позволяет «держать лицо» (сохранять фасад) во взаимодействии?|Подкожная мышца шеи (Platysma).
Какая мышца отвечает за способность «отпускать контакт», когда потребность удовлетворена?|Разгибатель мизинца (Extensor digiti minimi).
Какое состояние НС характеризуется активностью инсулина и накоплением топлива?|Дорсальное вагальное (экстренное торможение).
Как называется способность «наполнить себя контактом» (мышца мизинца)?|Короткий сгибатель мизинца руки.
Какая мышца помогает сохранять вертикальную позицию (отношение к жизни)?|Мышца, выпрямляющая позвоночник (Erector spinae).
К какой эго-функции относится подфункция «самооценка в ролевом Эго»?|Центрирование.
Какая мышца (из структуры Воли) отвечает за утверждение независимости?|Мышца, опускающая угол рта (Depressor anguli oris).
Какая мышца связана с альтруизмом и желанием «делать что-то для мира»?|Задняя верхняя зубчатая мышца.
Что является целью телесного отзеркаливания в парах?|Выявление того, какая мышца «зовет» и из какой структуры идет запрос клиента.</script>
<script type="text/plain" id="d2">Что такое примитивные рефлексы с точки зрения эволюции?|Это древние, базовые программы движения, работающие на уровне ствола и спинного мозга без участия коры.
Примитивные рефлексы возникают в ответ на конкретный _____ стимул.|сенсорный
На каком нейроанатомическом уровне замыкаются дуги примитивных рефлексов?|На уровне ствола головного мозга и спинного мозга.
Перечислите три ключевых компонента каждого рефлекса.|Сенсорный (триггер), моторный (движение) и вегетативно-эмоциональный (физиологическая реакция).
Как называется рефлекс, триггером которого является потеря опоры или резкий звук?|Рефлекс Моро.
Какие вегетативные команды сопровождают активацию рефлекса Моро?|Выброс кортизола и адреналина, ускорение сердцебиения и расширение зрачков.
Какую основную функцию выживания выполняет поисковый и сосательный рефлексы?|Обеспечение возможности получения питания новорожденным.
Какой рефлекс помогает плоду «протискиваться» через родовой канал за счет латерального изгиба позвоночника?|Рефлекс Галанта.
Функция «строительных лесов» примитивных рефлексов заключается в подготовке базы для _____ движений.|произвольных
Какой рефлекс готовит младенца к зрительно-моторной координации, разгибая руку при повороте головы?|Асимметричный шейно-тонический рефлекс (АШТР).
К какому двигательному навыку готовит ребенка Симметричный шейно-тонический рефлекс (СШТР)?|К ползанию на четвереньках.
Процесс миелинизации нейронных сетей при многократном срабатывании рефлексов называется функцией _____.|развития нервной системы
Что в контексте рефлексов означает термин «интеграция»?|Встраивание рефлекса в более сложные двигательные автоматизмы под контроль коры мозга.
В какой зрелый рефлекс испуга в норме интегрируется рефлекс Моро?|В рефлекс Штрауса.
Какое физиологическое изменение в мозге обеспечивает торможение примитивных рефлексов?|Развитие тормозящего влияния коры и мозжечка на ствол мозга.
Как высокий уровень кортизола у матери во время беременности влияет на рефлексы плода?|Он настраивает нервную систему на гиперреактивность и препятствует интеграции РПС.
Почему плановое кесарево сечение может привести к неинтеграции «родовых» рефлексов?|Программы прохождения родовых путей не получают возможности «отработать» из-за отсутствия стимулов.
Какая основная причина неинтеграции рефлексов в раннем детстве связана с современным образом жизни?|Недостаток сенсомоторного опыта (длительное нахождение в автокреслах, шезлонгах, пропуск этапа ползания).
Могут ли интегрированные рефлексы реактивироваться у взрослого человека?|Да, под влиянием тяжелых травм, сильного стресса или повреждений мозга.
Как называется рефлекс, формирующийся на 5–7 неделе внутриутробного развития и являющийся предшественником Моро?|Рефлекс паралича при страхе (РПС).
В норме РПС должен быть полностью интегрирован к _____.|моменту рождения
К какой бодинамической структуре характера относится РПС?|К структуре существования (пренатальная фаза).
Какая мышца считается главной «мышцей замирания» и активно задействована при неинтегрированном РПС?|Подвздошно-поясничная мышца (psoas).
Согласно поливагальной теории, РПС связан с активацией _____ вагуса.|дорзального
Назовите характерный паттерн поведения взрослого с активным РПС в ситуации стресса.|Замирание (freeze), диссоциация или невозможность инициировать действие.
Какой термин описывает неспособность говорить в условиях стресса при активном РПС?|Селективный мутизм.
Какое ключевое правило последовательности работы с рефлексами?|Сначала интегрируется РПС, затем Моро, и только потом все остальные.
Упражнение «Поза эмбриона с покачиванием» используется для интеграции какого рефлекса?|Рефлекса паралича при страхе (РПС).
Почему при активном РПС противопоказаны дыхательные задержки на выдохе?|Они могут усугубить состояние дорзального замирания нервной системы.
В какой период жизни в норме должен интегрироваться рефлекс Моро?|К 2–4 месяцам жизни.
При неинтегрированном рефлексе Моро человек живет в режиме постоянного _____.|аларма (симпатической активации)
Какая эндокринная система часто истощается у взрослых с неинтегрированным рефлексом Моро?|Ось ГГН (гипоталамус-гипофиз-надпочечники).
Упражнение «Звезда» является золотым стандартом для интеграции какого рефлекса?|Рефлекса Моро.
Какой рефлекс отвечает за невозможность пересекать среднюю линию тела без сознательного усилия?|Асимметричный шейно-тонический рефлекс (АШТР).
В каком возрасте в норме интегрируется АШТР?|К 6 месяцам.
С какой бодинамической структурой связан АШТР?|Структура потребности (ранняя фаза).
Упражнение «Ящерица» используется для работы с каким рефлексом?|Асимметричным шейно-тоническим рефлексом (АШТР).
В чем проявляется неинтеграция СШТР при работе взрослого за компьютером?|Быстрая усталость глаз при переключении фокуса и «съеденная» шея (голова вперед).
К какой бодинамической структуре относится СШТР?|Структура автономии.
Какой рефлекс является базисом для ориентации в пространстве и антигравитационных движений?|Тонический лабиринтный рефлекс (ТЛР).
Какое состояние часто наблюдается у взрослых с неинтегрированным ТЛР при поездках?|Морская болезнь (укачивание).
Рефлекс Ландау в бодинамике связан с формированием структуры _____.|Воли
Как проявляется активный рефлекс Галанта у взрослого при ношении одежды?|Непереносимость тугих поясов, ремней и бирок на одежде.
С каким расстройством часто путают активный рефлекс Галанта у взрослых?|СДВГ (из-за постоянного желания ерзать и двигаться).
Как неинтегрированный ладонный хватательный рефлекс влияет на речь?|Вызывает синкинезии (движения губ/языка при письме) и трудности с артикуляцией.
Какой рефлекс стопы связан с фундаментом заземления и опорой на реальность?|Подошвенный рефлекс Бабинского.
К какой структуре характера бодинамики относятся поисковый и сосательный рефлексы?|К структуре потребности.
Как называется нейробиологический процесс организации сигналов от всех органов чувств для формирования ответа?|Сенсорная интеграция.
Кто ввел понятие сенсорной интеграции в 1960–70-х годах?|Энн Джин Айрес (A. Jean Ayres).
Назовите три фундаментальные сенсорные системы, на которых строятся все остальные.|Вестибулярная, проприоцептивная и интероцептивная системы.
Какая сенсорная система информирует мозг о положении головы относительно гравитации?|Вестибулярная система.
За что отвечает проприоцептивная система?|За ощущение положения частей тела в пространстве и мышечного тонуса без участия зрения.
Что воспринимает интероцептивная система?|Сигналы от внутренних органов (сердцебиение, голод, жажда, эмоции).
В какой зоне мозга происходит первичная обработка интероцептивных сигналов?|В островковой коре (insula).
Как называется тип нарушения, при котором нервная система реагирует на стимулы слишком сильно?|Сенсорная гиперреактивность (over-responsivity).
Мизофония — это негативная реакция на специфические звуки в рамках _____ гиперреактивности.|слуховой
Что характерно для сенсорной гипореактивности?|Слабая или замедленная регистрация стимулов (кажущаяся отрешенность, нечувствительность к боли).
Как проявляется паттерн «сенсорный поиск»?|Потребность в интенсивной стимуляции (экстрим, громкая музыка, постоянное движение).
Что такое диспраксия в контексте сенсорно-моторных нарушений?|Нарушение моторного планирования и сложности с освоением новых движений.
Термин «сенсорная диета» был предложен каким специалистом?|Патрицией Уилбаргер (Patricia Wilbarger).
Какие сенсорные стимулы обычно обладают успокаивающим и организующим действием?|Глубокое давление, медленное раскачивание, проприоцептивная нагрузка (тяжести).
Какая сенсорная система анатомически неразрывно связана со слуховой системой?|Вестибулярная система (обе находятся во внутреннем ухе).
Почему рефлексы называют «первичным учебником» сенсорной интеграции?|Каждый рефлекс — это готовый акт получения стимула и формирования адаптивного ответа.
Как активный АШТР влияет на развитие зрения?|Он препятствует развитию конвергенции и способности пересекать среднюю линию глазами.
Какая система является базой для эмоциональной саморегуляции?|Интероцептивная система.
Состояние, при котором нейтральные стимулы воспринимаются как угроза, называется сенсорной _____.|защитой
Какой уровень «пирамиды Айрес» отвечает за академические навыки и саморегуляцию?|Четвертый уровень (когнитивные функции и поведение).
Как долго в среднем длится цикл интеграции одного рефлекса у взрослого?|От 6 недель до 3–6 месяцев регулярной работы.
Почему работа с корой (психотерапия) может быть неэффективна при неинтегрированных рефлексах?|Проблема находится на уровне ствола мозга, который не перепрограммируется через понимание.
Какое воздействие помогает тренировать блуждающий нерв и снижать реактивность Моро?|Холодовое воздействие (например, контрастный душ).
Какой рефлекс в бодинамике отвечает за право на собственное направление?|Асимметричный шейно-тонический рефлекс (АШТР).
Какие мышцы в бодинамике называют «мышцами достоинства и воли»?|Разгибатели спины, большие ягодичные и задняя поверхность бедра (связаны с рефлексом Ландау).
Что является признаком слишком интенсивной и небезопасной работы с рефлексами?|Усиление симптомов более чем на 30%, флешбэки или диссоциация.
К какой группе относятся зрительная, слуховая, тактильная, обонятельная и вкусовая системы?|Привычные (внешние) сенсорные системы.
Для интеграции какого рефлекса используется упражнение «Супермен» на животе?|Рефлекс Ландау.</script>
<script>
var DECKS=[
 {id:'d1',title:'Бодинамика',sub:'Экзаменационные карточки'},
 {id:'d2',title:'Рефлексы',sub:'Экзаменационные карточки'}
];
function parse(id){
  return document.getElementById(id).textContent.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){
    var k=l.indexOf('|');return {id:i,q:l.slice(0,k).trim(),a:l.slice(k+1).trim()};
  });
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
DECKS.forEach(function(D){
  var all=parse(D.id),order=all.slice(),i=0,ans=false,fin=false,mark={};
  var el=document.createElement('section');el.className='deck';
  el.innerHTML='<h2>'+esc(D.title)+'</h2><p class="sub">'+esc(D.sub)+'</p>'+
  '<div class="play"><div class="prog"><b></b><div class="bar"><i></i></div></div>'+
  '<div class="card" tabindex="0"><div class="tag"></div><div class="body"><div class="txt"></div></div><div class="hint"></div></div>'+
  '<div class="row"><button class="nav prev" aria-label="Назад">←</button><button class="show"></button><button class="nav next" aria-label="Дальше">→</button></div>'+
  '<div class="row rates" hidden><button class="rate rep">Повторить</button><button class="rate kn">Знаю</button></div>'+
  '<div class="row small"><button class="shuf">⇄ Перемешать</button><button class="rst">↻ Начать заново</button></div></div>'+
  '<div class="done" hidden><h3>Колода пройдена</h3><p></p><div class="row"><button class="main again">Пройти ещё раз</button><button class="hard" hidden></button></div></div>';
  document.getElementById('app').appendChild(el);
  var $=function(s){return el.querySelector(s)};
  function render(){
    $('.play').hidden=fin;$('.done').hidden=!fin;
    if(fin){
      var k=0,r=0;all.forEach(function(c){if(mark[c.id]===1)k++;else if(mark[c.id]===0)r++});
      $('.done p').textContent='Знаю: '+k+'. На повторение: '+r+'.';
      var left=all.length-k;var h=$('.hard');h.hidden=left===0;h.textContent='Повторить непройденные ('+left+')';
      return;
    }
    var c=order[i];
    $('.prog b').textContent=(i+1)+' из '+order.length;
    $('.bar i').style.width=((i+1)/order.length*100)+'%';
    $('.tag').textContent=ans?'Ответ':'Вопрос';
    var t=$('.txt');t.className='txt';
    var text=ans?(c.a||'Ответ не указан в материале'):c.q;
    if(ans&&!c.a)t.className='txt miss';
    t.textContent=text;t.style.animation='none';void t.offsetWidth;t.style.animation='';
    $('.hint').textContent=ans?'Оцените ответ или нажмите, чтобы вернуться к вопросу':'Нажмите на карточку, чтобы увидеть ответ';
    $('.show').textContent=ans?'Показать вопрос':'Показать ответ';
    $('.rates').hidden=!ans;
    $('.prev').disabled=i===0;
  }
  function go(){ if(i>=order.length-1){fin=true}else{i++;ans=false} render(); }
  function flip(){ans=!ans;render()}
  function setOrder(a){order=a;i=0;ans=false;fin=false;render()}
  $('.card').addEventListener('click',flip);
  $('.show').addEventListener('click',flip);
  $('.next').addEventListener('click',go);
  $('.prev').addEventListener('click',function(){if(i>0){i--;ans=false;render()}});
  $('.rep').addEventListener('click',function(){mark[order[i].id]=0;go()});
  $('.kn').addEventListener('click',function(){mark[order[i].id]=1;go()});
  $('.shuf').addEventListener('click',function(){var a=all.slice();for(var n=a.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1));var t=a[n];a[n]=a[j];a[j]=t}mark={};setOrder(a)});
  $('.rst').addEventListener('click',function(){mark={};setOrder(all.slice())});
  $('.again').addEventListener('click',function(){mark={};setOrder(all.slice())});
  $('.hard').addEventListener('click',function(){setOrder(all.filter(function(c){return mark[c.id]!==1}))});
  $('.card').addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}else if(e.key==='ArrowRight')go();else if(e.key==='ArrowLeft'&&i>0){i--;ans=false;render()}});
  render();
});
</script>
</body>
</html>
